name: 記錄台指期夜盤

# 自動記錄已改由 Render 伺服器負責（每個交易日 14:58 自己啟動，一路記到 05:00）；
# GitHub 排程常延遲幾十分鐘，會漏掉 15:00 開盤那段，所以這裡只保留手動啟動當備援：到 Actions 按 Run workflow。
# 手動時一次最多 6 小時，會接著 night 分支上已記錄的部分繼續記。Render 正在記錄時不要手動啟動，兩邊會互相覆蓋。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: night-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 取得程式
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install --quiet requests

      - name: 記錄夜盤
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHT_DIR: ${{ runner.temp }}/nightout
        run: python night_recorder.py

name: 記錄盤中資金流

# 週一到週五 08:35（台灣時間）啟動，記錄 09:00–13:30，結果存到 flow 分支的 today.json
# GitHub 排程偶爾會延遲，所以 08:50 再排一次備援（同時間只會有一個在跑）
on:
  schedule:
    - cron: "35 0 * * 1-5"
    - cron: "50 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flow-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: 取得程式
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install --quiet requests

      - name: 記錄資金流
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLOW_DIR: ${{ runner.temp }}/flowout
        run: python flow_recorder.py

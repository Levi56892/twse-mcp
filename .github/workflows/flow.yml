name: 記錄盤中資金流

# 自動記錄已改由 Render 伺服器負責（每個交易日 08:45 自己啟動）。
# 這裡只保留手動啟動當備援：到 Actions 按 Run workflow 即可。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flow-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: 取得程式
        uses: actions/checkout@v4

      - name: 取得歷史成交資料（挑選各產業成交金額前 20 名用）
        uses: actions/checkout@v4
        with:
          ref: data
          path: databr

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install --quiet requests

      - name: 記錄資金流
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLOW_DIR: ${{ runner.temp }}/flowout
          DATA_DIR: databr
        run: python flow_recorder.py

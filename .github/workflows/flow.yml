name: 記錄盤中資金流

# 週一到週五 08:35（台灣時間）啟動，記錄 09:00–13:30，結果存到 flow 分支的 today.json
# GitHub 排程常會延遲甚至略過，所以 08:20～10:20 每 10 分鐘排一次備援。
# 同時間只會有一個在跑；已經在記錄時，備援會排隊，等收盤後啟動並立刻結束，不會覆蓋資料。
on:
  schedule:
    - cron: "20,30,40,50 0 * * 1-5"
    - cron: "0,10,20,30,40,50 1 * * 1-5"
    - cron: "0,10,20 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flow-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: 取得程式
        uses: actions/checkout@v4

      - name: 取得歷史成交資料（挑選各產業成交金額前 20 名用）
        uses: actions/checkout@v4
        with:
          ref: data
          path: databr

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install --quiet requests

      - name: 記錄資金流
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLOW_DIR: ${{ runner.temp }}/flowout
          DATA_DIR: databr
        run: python flow_recorder.py
